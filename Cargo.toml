[package]
name = "yam"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "yamd"
path = "src/main.rs"

[[bin]]
name = "yam"
path = "src/bin/yam.rs"

[[bin]]
name = "yam-registry"
path = "src/bin/yam-registry.rs"
required-features = ["registry"]

[features]
registry = ["dep:aws-config", "dep:aws-credential-types", "dep:aws-sdk-s3", "dep:aws-types", "dep:sha2"]

[dependencies]
anyhow = "1"
aws-config = { version = "1", optional = true }
aws-credential-types = { version = "1", optional = true }
aws-sdk-s3 = { version = "1", optional = true }
aws-types = { version = "1", optional = true }
axum = { version = "0.7", features = ["multipart"] }
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize", "send"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
url = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
zip = "2"
tar = "0.4"
